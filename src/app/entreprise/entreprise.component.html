<app-navbar>
  <div class="container">

    <div class="content-top">
      <div class="row">
        <div class="col">
          <h2 class="welcome-title">Entreprises</h2>
        </div>
        <div class="col">
          <div style="float: right;">
           <button class="nouveau-projet-btn" [routerLink]="['/add/entreprise']">
              <svg class="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" /></svg>
              Nouveau
           </button>
        </div>
        </div>
      </div>
    </div><!--content-->
    <mat-divider style="margin-bottom: 30px;"></mat-divider>

    <div>

      <div class="row" style="margin-bottom: 30px;">

        <div class="col">
          <input type="text" class="search-input" id="exampleFormControlInput1" placeholder="Rechercher..."  (keyup)="applyFilter($event)">
        </div><!--col-->

        <div class="col">
          <div style="float: right;">
            <div class="view-toggle-container">
              <div class="view-toggle-wrapper">
                  <!-- Bouton Vue Grille -->
                  <button  (click)="getList()" class="view-toggle-btn" [ngClass]="{'active-grid': !isListe, 'inactive-grid': isListe}">
                    <i class="fa-solid fa-grip" style="font-size: 19px"></i>
                  </button>

                  <!-- Bouton Vue Liste -->
                  <button  (click)="getList()" class="view-toggle-btn" [ngClass]="{'active-list': isListe, 'inactive-list': !isListe}">
                      <i class="fa-solid fa-table" style="font-size: 19px"></i>
                  </button>
              </div>
            </div>
          </div>
        </div><!--col-->
     </div><!--row-->

    <div class="bloc-projets" [hidden]="entreprises">
        <p class="notdata">Aucun données</p>
    </div><!--bloc-->

     <div class="bloc-projets" [hidden]="!entreprises">
      <div class="row" [hidden]="isListe">
        <div class="col-3" *ngFor="let entreprise of entreprises" style="margin-bottom: 15px;">
          <div class="card project-card">
              <div class="project-image-container">
                <img src="{{entreprise?.photo}}" *ngIf="entreprise?.photo" class="project-image"/>
                <img src="assets/images/ent.png" *ngIf="!entreprise?.photo"  class="project-image"/>
                <div class="project-badge">
                  <span class="status-badge">{{entreprise?.nbr_projet}}</span>
                </div>
              </div>
              <div class="card-body  project-content">
                <p class="project-client" matTooltip="{{entreprise?.societe}}">{{entreprise?.societe}}</p>
                <p align="center">
                  <button type="button" class="details-button" (click)="getEntreprise(entreprise?._id)">Détail</button>
                </p>
              </div>
          </div>
        </div><!--col-->
      </div><!--row-->
      <div [hidden]="!isListe">
        <app-tab-entreprise></app-tab-entreprise>
      </div>
     </div><!--projets-->


    </div><!--content-top-->
  </div>
</app-navbar>

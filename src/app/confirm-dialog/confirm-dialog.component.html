<div class="confirm-dialog-container">
  <!-- En-tête du dialogue -->
  <div class="dialog-header" *ngIf="title">
    <h2 mat-dialog-title class="dialog-title">
      <mat-icon *ngIf="icon" class="dialog-icon">{{icon}}</mat-icon>
      {{title}}
    </h2>
    <button mat-icon-button class="close-button" (click)="onCancel()" aria-label="Fermer">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Contenu du dialogue -->
  <mat-dialog-content class="dialog-content">
    <div class="message-container">
      <mat-icon *ngIf="!title && icon" class="message-icon">{{icon}}</mat-icon>
      <div class="message-text" [innerHTML]="message"></div>
    </div>
  </mat-dialog-content>

  <!-- Actions du dialogue -->
  <mat-dialog-actions class="dialog-actions" align="end">
    <!-- Bouton Annuler (optionnel) -->
    <button mat-button
            *ngIf="showCancel"
            (click)="onCancel()"
            class="cancel-button"
            [attr.aria-label]="cancelText">
      {{cancelText}}
    </button>

    <!-- Bouton Confirmer -->
    <button mat-raised-button
            [color]="confirmColor"
            (click)="onConfirm()"
            class="confirm-button"
            [attr.aria-label]="confirmText"
            cdkFocusInitial>
      {{confirmText}}
    </button>
  </mat-dialog-actions>
</div>

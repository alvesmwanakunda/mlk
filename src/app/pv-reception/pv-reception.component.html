<div class="container">
  <div style="padding-top: 14px !important;margin-bottom: 50px;padding-bottom: 50px !important;">

    <div>
      <div>
        <div class="mb-3">
          <div align="right" *ngIf="!pvReceptions.length">
            <button type="button" class="btn btn-piece"  style="margin-right: 10px;" (click)="openDialog()"><i class="fa-solid fa-plus"></i> Nouveau</button>
          </div>
        </div>
        <mat-divider></mat-divider>
          <table mat-table [dataSource]="dataSource">

            <!-- Position Column -->
            <ng-container matColumnDef="pv">
              <th mat-header-cell *matHeaderCellDef class="box-header"> Type de PV </th>
              <td mat-cell *matCellDef="let element" style="font-size: 13px;">
                {{element?.declaration}}
              </td>
            </ng-container>

            <ng-container matColumnDef="version">
              <th mat-header-cell *matHeaderCellDef class="box-header"> Version </th>
              <td mat-cell *matCellDef="let element" style="font-size: 13px;">
                {{element?.version}}
              </td>
            </ng-container>

            <!-- Name Column -->
            <ng-container matColumnDef="date">
              <th mat-header-cell *matHeaderCellDef class="box-header"> Date </th>
              <td mat-cell *matCellDef="let element" style="font-size: 13px;">
              Fait à {{element?.place}}, le {{element?.date | date:'dd/MM/yyyy'}}
              </td>
            </ng-container>

            <ng-container matColumnDef="action">
              <th mat-header-cell *matHeaderCellDef>Actions</th>
              <td mat-cell *matCellDef="let element">
                <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
                  <mat-icon>more_vert</mat-icon>
                </button>

                <mat-menu #menu="matMenu">
                  <button mat-menu-item (click)="openDialogUpdate(element?.id)">
                    <mat-icon style="font-size: 18px;">edit</mat-icon>
                    <span style="font-size: 14px;">Détail</span>
                  </button>
                  <button mat-menu-item (click)="openDelete(element?.id)">
                    <mat-icon style="font-size: 18px;">delete</mat-icon>
                    <span style="font-size: 14px;">Supprimer</span>
                  </button>
                  <button mat-menu-item (click)="openDownloadDialog(element?.id)">
                    <mat-icon style="font-size: 18px;">download</mat-icon>
                    <span style="font-size: 14px;">Télécharger</span>
                  </button>
                   <button *ngIf="element?.type=='WITH_RESERVES' && element?.status=='DRAFT'" mat-menu-item (click)="openDialogLevee(element?.id)">
                    <mat-icon style="font-size: 18px;">assignment</mat-icon>
                    <span style="font-size: 14px;">Levée les réserves</span>
                  </button>
                </mat-menu>
              </td>
            </ng-container>


            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
          <mat-paginator [pageSizeOptions]="[10, 20]"
                        showFirstLastButtons
                        aria-label="Select page of periodic elements">
          </mat-paginator>
      </div><!--ISLISTE-->

    </div>
  </div>
</div>

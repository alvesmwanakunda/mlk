<div class="download-pv-dialog">
  <h3 mat-dialog-title>Télécharger le PV</h3>
  <mat-divider style="margin-bottom: 10px;"></mat-divider>

  <div mat-dialog-content>
    <p *ngIf="pv" style="font-size: 12px;">Titre du pv: <strong >{{ pv?.titre || 'Sans titre' }}</strong></p>
    <p *ngIf="pv?.travaux?.planUrl; else noPlan" style="font-size: 12px;color: rgb(3, 49, 101);">Plan détecté: il sera ajouté en dernière page.</p>
    <ng-template #noPlan>
      <p>Aucun plan trouvé. Le template sera téléchargé sans page supplémentaire.</p>
    </ng-template>
  </div>

  <div mat-dialog-actions align="end">
    <button mat-stroked-button type="button" (click)="close()" [disabled]="isLoading">Fermer</button>
    <button mat-raised-button color="primary" type="button" (click)="downloadMergedPdf()" [disabled]="isLoading || !pv">
      {{ isLoading ? 'Génération...' : 'Télécharger' }}
    </button>
  </div>
</div>

  <mat-dialog-content class="mat-typography stock-dialog-content">
    <div class="row stock-toolbar-row" style="margin-bottom: 15px;">
        <div class="col-12 col-md-6">
          <input type="text"  (keyup)="applyFilter($event)" class="form-control input-search" id="exampleFormControlInput1" placeholder="Rechercher">
        </div>
        <div class="col-12 col-md-6 stock-toolbar-actions">
           <button mat-raised-button color="primary"
            (click)="addModules()"
            [disabled]="selection.selected.length === 0"
            class="add-multiple-btn">
            Ajouter les {{selection.selected.length}} module(s) sélectionné(s)
          </button>
        </div>
      </div>
      <div class="stock-table-wrap">
      <table mat-table [dataSource]="dataSource" matSort #matSort="matSort">
          <!-- Position Column -->
           <ng-container matColumnDef="select">
              <th mat-header-cell *matHeaderCellDef>
                <mat-checkbox
                  (change)="$event ? masterToggle() : null"
                  [checked]="selection.hasValue() && isAllSelected()"
                  [indeterminate]="selection.hasValue() && !isAllSelected()">
                </mat-checkbox>
              </th>
              <td mat-cell *matCellDef="let row">
                <mat-checkbox
                  (click)="$event.stopPropagation()"
                  (change)="$event ? selection.toggle(row) : null"
                  [checked]="selection.isSelected(row)">
                </mat-checkbox>
              </td>
          </ng-container>
          <ng-container matColumnDef="numero">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Numéro </th>
            <td mat-cell *matCellDef="let element" style="cursor: pointer;font-size: 12px;"> {{element?.numero}} </td>
          </ng-container>

          <ng-container matColumnDef="nom">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Article </th>
            <td mat-cell *matCellDef="let element" style="cursor: pointer;font-size: 12px;"> {{element?.nom}} </td>
          </ng-container>

          <ng-container matColumnDef="type">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Catégorie </th>
            <td mat-cell *matCellDef="let element" style="cursor: pointer;font-size: 12px;"> {{element?.type}} </td>
          </ng-container>


          <!-- Weight Column -->
          <ng-container matColumnDef="hauteur">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Hauteur</th>
            <td mat-cell *matCellDef="let element" style="font-size: 12px;cursor: pointer;">{{element?.hauteur}}  </td>
          </ng-container>

          <ng-container matColumnDef="largeur">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Largeur</th>
            <td mat-cell *matCellDef="let element" style="font-size: 12px;cursor: pointer;">{{element?.largeur}}  </td>
          </ng-container>

          <ng-container matColumnDef="longueur">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Longueur</th>
            <td mat-cell *matCellDef="let element" style="font-size: 12px;cursor: pointer;">{{element?.longueur}}  </td>
          </ng-container>

          <!--<ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef>Action</th>
            <td mat-cell *matCellDef="let element">
             <button  (click)="addModule(element?.id)" mat-flat-button color="primary"><i class="fa-solid fa-plus"></i> Ajouter au projet</button>
            </td>
          </ng-container>-->


          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>

        <mat-paginator #paginatorStock [pageSizeOptions]="[10, 20]"
                      showFirstLastButtons
                      aria-label="Select page of periodic elements"
                      >
        </mat-paginator>
  </mat-dialog-content>
  <mat-dialog-actions align="center">
     <button mat-raised-button mat-dialog-close color="warn">Fermer</button>
  </mat-dialog-actions>

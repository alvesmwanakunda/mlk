<app-navbar-user></app-navbar-user>

<div style="background-color: white !important;">
  <div class="d-flex justify-content-between" style="background-color: white !important; padding-top: 4rem;">
   
    <div class="d-flex align-items-end" style="background-image: url('assets/images/left_side.jpg');  width: 60%; min-height: calc(100vh - 4rem); background-size: cover; background-repeat: no-repeat; padding: 0 0 45px 45px;">
      <h3 style="font-size: 32px; font-weight:700; letter-spacing: 1.5px; line-height: 40px; background-color: rgba(255, 255, 255, 0.5); padding: 25px;">
        CONSTRUISEZ L'<span style="color: #265e86;">AVENIR</span>, <br>
        <span style="color: #265e86;">MODULEZ</span> VOTRE ESPACE !
      </h3>
    </div>
    
    <div style="background-color: white !important; min-height: calc(100vh - 6rem); width: 40%; display: flex; align-items: center !important;">
      <div class="container-lg justify-content-md-center d-flex" style=" height:fit-content !important;">
          <mat-card style="background-color: #ffffff !important; box-shadow: 0px 0px 0px rgba(0, 0, 0, 0) !important; width: 100%;">
            <mat-card-content style="padding-top: 30px !important;padding-bottom: 30px !important;">
                <div class=" d-flex justify-content-center" style="margin-bottom: 10px;">
                    <svg width="80px" height="80px" style="color: rgb(0, 228, 0);" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"  fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="m8.032 12 1.984 1.984 4.96-4.96m4.55 5.272.893-.893a1.984 1.984 0 0 0 0-2.806l-.893-.893a1.984 1.984 0 0 1-.581-1.403V7.04a1.984 1.984 0 0 0-1.984-1.984h-1.262a1.983 1.983 0 0 1-1.403-.581l-.893-.893a1.984 1.984 0 0 0-2.806 0l-.893.893a1.984 1.984 0 0 1-1.403.581H7.04A1.984 1.984 0 0 0 5.055 7.04v1.262c0 .527-.209 1.031-.581 1.403l-.893.893a1.984 1.984 0 0 0 0 2.806l.893.893c.372.372.581.876.581 1.403v1.262a1.984 1.984 0 0 0 1.984 1.984h1.262c.527 0 1.031.209 1.403.581l.893.893a1.984 1.984 0 0 0 2.806 0l.893-.893a1.985 1.985 0 0 1 1.403-.581h1.262a1.984 1.984 0 0 0 1.984-1.984V15.7c0-.527.209-1.031.581-1.403Z"/>
                    </svg>
                </div>
                <!-- <h1 class="content-form" style="margin-bottom: 10px;">
                    <span class="title-login">Vérification du code</span>
                </h1> -->
                <div class="container" style="padding: 0 10px 30px 10px ; ">
                    <p class="text-center"  style="font-size:large; line-height: 1.5;">Veuillez saisir le code de validation à 6 chiffres {{type=="application" ? "de votre application d'authentification" : "reçu par mail"}}.</p>
                </div>

              <form [formGroup]="otpForm" (ngSubmit)="onSubmit()" novalidate style="margin-bottom: 20px;">
                <div *ngIf="errorMessage">
                  <p class="text-danger text-center">{{errorMessage}}</p>
                </div>
                <div class="content-form">
                  <div class="otp-row">
                    <input *ngFor="let ctrl of otpControls; let i = index"
                      class="otp-input"
                      #otpInput
                      maxlength="1"
                      type="text"
                      formControlName="otp{{i}}"
                      autocomplete="one-time-code"
                      (input)="autoFocusNext($event, i)"
                    />
                  </div>
                  <div align="center" style="margin-bottom: 30px; margin-top: 30px;">
                    <button mat-raised-button [disabled]="onLoad" type="submit" class="sizeButtonLogin" style="color: #fff;">Valider</button>
                  </div>
                </div>
            </form>
            <div *ngIf="type=='email'" class="text-center" style=" font-size: 15px;">
              <span>Vous n'avez pas reçu de code ? </span>
              <a style="cursor: pointer; font-weight: 500;" (click)="resendCode($event)">Renvoyer</a>
            </div>
            </mat-card-content>
            <mat-card-footer>
              <div *ngIf="onLoad">
                <mat-progress-bar mode="indeterminate"></mat-progress-bar>
              </div>
            </mat-card-footer>
          </mat-card>
      </div>
    </div>
  </div>
</div>

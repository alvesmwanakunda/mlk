  <div class="container-fluid">

    <div class="row justify-content-md-center">

      <div class="col-lg-11 col-md-11 col-md-auto">
        <div>
          <div class="row" style="margin-bottom: 10px;padding-top: 15px;">
            <div class="col">
              <h1 class="text-3xl font-bold text-gray-900">Tâche</h1>
            </div>
            <div class="col" align="right">
               <button mat-icon-button color="primary" (click)="close()">
                <mat-icon>close</mat-icon>
               </button>
            </div>
          </div>
          <mat-divider></mat-divider>
        </div>

        <div class="row" style="margin-bottom: 10px;padding-top: 10px;">
          <div class="col">
            <div style="padding-top: 25px;">
              <button mat-raised-button color="primary" class="me-2" (click)="updateTask()"><mat-icon>edit</mat-icon> Modifier</button>
              <button mat-raised-button color="warn" (click)="openDialog()"><mat-icon>delete</mat-icon> Supprimer</button>
            </div>
          </div>
          <div class="col">
              <div style="float: right;">
                 <div class="stepper">
                    <ng-container *ngFor="let step of steps; let last = last">
                      <div class="step" [class.active]="step.active">
                        <span>{{ step.label }}</span>
                        <small *ngIf="step.days">{{ step.days }}</small>
                      </div>
                      <div class="arrow" *ngIf="!last"></div>
                    </ng-container>
                 </div>
          </div>
        </div>
         <mat-divider></mat-divider>

          <div *ngIf="tache" style="padding-top: 30px;margin-bottom: 30px;">
            <div class="row">
              <div class="col">
                 <form [formGroup]="taskFormGroup">
                  <div class="row">
                    <div class="col">
                      <div>
                        <mat-form-field class="example-full-width">
                        <input matInput  formControlName="titre" required style="font-size: 20px !important;font-weight: 600 !important;">
                        </mat-form-field>
                        <div *ngIf="taskFormGroup.get('titre').hasError(champ_validation.input[0].type) &&(taskFormGroup.get('titre').dirty || taskFormGroup.get('titre').touched)">
                          <p class="error_field">{{champ_validation.input[0].message}}</p>
                        </div>
                      </div>
                      <div style="padding-top: 19px;">
                        <mat-form-field class="example-full-width">
                          <mat-label class="tache_label">Assignés</mat-label>
                          <mat-select matInput  formControlName="assignes">
                            <mat-option *ngFor="let contact of contacts" [value]="contact?._id">{{contact?.nom}} {{contact?.prenom}}</mat-option>
                          </mat-select>
                          </mat-form-field>
                      </div>
                      <div>
                        <mat-form-field class="example-full-width">
                          <mat-label class="tache_label">Description</mat-label>
                          <textarea matInput formControlName="description"></textarea>
                        </mat-form-field>
                      </div>
                    </div>
                    <div class="col">
                      <div>
                        <div class="row">
                          <div class="col-4">
                              <mat-form-field class="example-full-width">
                              <mat-label class="tache_label">Temps alloué</mat-label>
                              <input type="time" matInput  formControlName="temps">
                              </mat-form-field>
                          </div>
                          <div class="col-2">
                            <p style="padding-top: 20px;">(0 %)</p>
                          </div>

                          <div class="col-6">
                            <mat-form-field class="example-full-width">
                              <mat-label class="tache_label">Statut</mat-label>
                              <mat-select matInput  formControlName="statut">
                                <mat-option value="A Faire">A Faire</mat-option>
                                <mat-option value="En Cours">En Cours</mat-option>
                                <mat-option value="Terminer">Terminer</mat-option>
                              </mat-select>
                            </mat-form-field>
                          </div>
                        </div>
                      </div>
                      <div>
                        <label style="font-size: 13px;">Date planifiée</label>
                        <div class="row">
                          <div class="col">

                            <mat-form-field class="example-full-width">
                              <mat-date-range-input  [rangePicker]="picker">
                              <input matStartDate formControlName="date_debut" placeholder="Début">
                              <input matEndDate formControlName="date_fin" placeholder="Fin">
                            </mat-date-range-input>
                            <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                            <mat-date-range-picker #picker></mat-date-range-picker>
                            <!--<input type="date" matInput  formControlName="date_debut">-->
                            </mat-form-field>
                          </div>
                        </div>

                      </div>
                      <div>
                        <div class="annotated-image-top-preview">
                          <div class="image-preview-container">
                            <div *ngIf="tache?.image?.url">
                              <img [src]="tache.image.url" class="preview-image" alt="Image de la tâche"/>
                             <input
                                  #fileInput
                                  type="file"
                                  accept="image/*"
                                  (change)="onImageSelected($event)"
                                  #fileUpload
                                  hidden
                                />
                              <button
                                class="remove-image-btn"
                                (click)="fileUpload.click()"
                                matTooltip="Editer l'image">
                                <i class="fa-solid fa-edit"></i>
                              </button>

                              <button
                                class="open-image-btn"
                                (click)="openDialogFile(tache?.image?.url,'png')"
                                matTooltip="Voir l'image">
                                <i class="fa-solid fa-eye"></i>
                              </button>
                            </div>

                            <div *ngIf="!tache?.image?.url">
                                  <img [src]="annotatedImagePreview" class="preview-image" alt="Aperçu image modifiée"  *ngIf="annotatedImagePreview"/>
                                  <img src="assets/images/task1.png" class="preview-image" alt="Image par défaut" *ngIf="!annotatedImagePreview"/>
                                  <input
                                  #fileInput
                                  type="file"
                                  accept="image/*"
                                  (change)="onImageSelected($event)"
                                  #fileUpload
                                  hidden
                                />
                                <button
                                  class="remove-image-btn"
                                  (click)="fileUpload.click()"
                                  matTooltip="Ajouter l'image">
                                  <i class="fa-solid fa-plus"></i>
                                </button>
                            </div>

                            <!-- 1) Preview locale (nouvelle image/annotation) -->

                              *ngIf="annotatedImagePreview; else existingOrDefault"
                              [src]="annotatedImagePreview"
                              class="preview-image"
                              alt="Aperçu image modifiée"
                            />-->

                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                 </form>
              </div>
            </div>

         </div>

         <app-sub-taches></app-sub-taches>

         <div>

         </div>
      </div>
  </div>

  </div>


<app-image-annotation
  *ngIf="showImageAnnotation && imageToAnnotate"
  [imageSrc]="imageToAnnotate"
  (annotationComplete)="onAnnotationComplete($event)"
  (annotationCanceled)="onAnnotationCanceled()">
</app-image-annotation>

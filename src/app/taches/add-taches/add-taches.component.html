<mat-dialog-content class="mat-typography">
  <div class="text-center" style="padding-top: 25px;"><p class="title-projet-page">Nouvelle tâche</p></div>
  <div class="row"><div class="col"><hr class="entreprise"></div></div><!--row-->
  <div>
    <form [formGroup]="taskFormGroup">

      <div style="margin-bottom: 8px;">
           <mat-form-field class="example-full-width">
            <mat-label class="tache_label">Titre de la tâche</mat-label>
             <input matInput  formControlName="titre" required>
            </mat-form-field>
            <div *ngIf="taskFormGroup.get('titre').hasError(champ_validation.input[0].type) &&(taskFormGroup.get('titre').dirty || taskFormGroup.get('titre').touched)">
              <p class="error_field">{{champ_validation.input[0].message}}</p>
            </div>

             <mat-form-field class="example-full-width">
                <mat-label class="tache_label">Date</mat-label>
                <mat-date-range-input  [rangePicker]="picker">
                <input matStartDate formControlName="date_debut" placeholder="Début" required>
                <input matEndDate formControlName="date_fin" placeholder="Fin" required>
                </mat-date-range-input>
                <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-date-range-picker #picker></mat-date-range-picker>
                        <!--<input type="date" matInput  formControlName="date_debut">-->
             </mat-form-field>
             <div>
              <span class="error_field" *ngIf="taskFormGroup.get('date_debut').hasError(champ_validation.input[0].type) &&(taskFormGroup.get('date_debut').dirty || taskFormGroup.get('date_debut').touched)">{{champ_validation.input[0].message}}</span>
              <span class="error_field" *ngIf="taskFormGroup.get('date_fin').hasError(champ_validation.input[0].type) &&(taskFormGroup.get('date_fin').dirty || taskFormGroup.get('date_fin').touched)">{{champ_validation.input[0].message}}</span>
            </div>


            <div class="row">
               <div class="col-6">
                <div *ngIf="!annotatedImagePreview">
                  <p class="tache_label">Ajouter une image</p>
                  <label class="icon-button" title="Ajouter une image">
                    <input #fileInput type="file" accept="image/*" (change)="onImageSelected($event)"  hidden />
                    <i class="fa-solid fa-image" style="font-size: 40px;color: #090774;"></i>
                  </label>
                </div>

                <div *ngIf="annotatedImagePreview" class="annotated-image-top-preview">
                  <div class="image-preview-container" (mouseenter)="isHoveringImage = true" (mouseleave)="isHoveringImage = false">
                    <img [src]="annotatedImagePreview" alt="Image annotée" class="preview-image">
                    <button
                      *ngIf="isHoveringImage"
                      class="remove-image-btn"
                      (click)="removeAnnotatedImage()"
                      title="Supprimer l'image">
                      <i class="fa-solid fa-trash"></i>
                    </button>
                    <div class="image-badge">
                      <i class="fa-solid fa-check"></i>
                      Image annotée
                    </div>
                  </div>
               </div>
               </div>
               <div class="col-6">
                 <mat-form-field class="example-full-width">
                  <mat-label class="tache_label">Assignés</mat-label>
                  <mat-select matInput  formControlName="assignes">
                    <mat-option *ngFor="let contact of contacts" [value]="contact?._id">{{contact?.nom}} {{contact?.prenom}}</mat-option>
                  </mat-select>
                </mat-form-field>
               </div>
            </div>
      </div><!--div-->
    </form>
  </div>
</mat-dialog-content>
<mat-dialog-actions>
   <button mat-button cdkFocusInitial style=" background: #29628b !important;color:#fff;margin-right: 5px" [disabled]="taskFormGroup.invalid" (click)="addTask()">Ajouter</button>
   <button mat-button mat-dialog-close style=" background: #8a0423 !important;color:#fff">Fermer</button>
</mat-dialog-actions>

<app-image-annotation
  *ngIf="showImageAnnotation && imageToAnnotate"
  [imageSrc]="imageToAnnotate"
  (annotationComplete)="onAnnotationComplete($event)"
  (annotationCanceled)="onAnnotationCanceled()">
</app-image-annotation>

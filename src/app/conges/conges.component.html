<app-navbar>
  <div class="topbar">
        <div class="topbar-left">
          <h1>Congés</h1>
        </div>
        <div class="topbar-right">
          <button class="topbar-btn btn-primary" [routerLink]="['/conges/nouveau']"> + Nouveau</button>
        </div>
  </div>
  <div class="content">
     <div>
        <div class="row" style="margin-bottom: 35px;">
          <div class="col">
            <input type="text"  (keyup)="applyFilter($event)" class="search-input" id="exampleFormControlInput1" placeholder="Rechercher">
          </div>
          <div class="col"  align="right">
          </div>
        </div>

        <table mat-table [dataSource]="dataSource">
          <!-- Position Column -->

           <!-- Symbol Column -->
           <ng-container matColumnDef="user">
            <th mat-header-cell *matHeaderCellDef class="tableau-title">Employée</th>
            <td mat-cell *matCellDef="let element" style="font-size: 12px;cursor: pointer;"> {{element?.user?.nom}} {{element?.user?.prenom}}</td>
          </ng-container>

           <!-- Weight Column -->
           <ng-container matColumnDef="demande">
            <th mat-header-cell *matHeaderCellDef class="tableau-title">Date de demande</th>
            <td mat-cell *matCellDef="let element" style="font-size: 12px;cursor: pointer;">{{element?.demande |date :'dd MMMM yyyy'}}  </td>
          </ng-container>

           <!-- Name Column -->
           <ng-container matColumnDef="valide">
            <th mat-header-cell *matHeaderCellDef class="tableau-title">Date de validation</th>
            <td mat-cell *matCellDef="let element" style="font-size: 12px;cursor: pointer;">{{element?.valide |date :'dd MMMM yyyy'}}</td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="type">
            <th mat-header-cell *matHeaderCellDef class="tableau-title">Conge</th>
            <td mat-cell *matCellDef="let element" style="font-size: 12px;cursor: pointer;">{{element?.type}}</td>
          </ng-container>

          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef class="tableau-title">Status</th>
            <td mat-cell *matCellDef="let element" style="font-size: 12px;cursor: pointer;">{{element?.status}}</td>
          </ng-container>

          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef class="tableau-title">Action</th>
            <td mat-cell *matCellDef="let element">
              <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #menu="matMenu">
                <button mat-menu-item  (click)="getConge(element?.id)">
                  <mat-icon>visibility</mat-icon>
                  <span>Détail</span>
                </button>
              </mat-menu>
            </td>
          </ng-container>


          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator [pageSizeOptions]="[10, 20]"
                      showFirstLastButtons
                      aria-label="Select page of periodic elements"
                      >
        </mat-paginator>


    </div>
  </div>
</app-navbar>

<div style="text-align: center; padding: 10px;">
    <h2 mat-dialog-title>Authentification à deux facteurs</h2>
    <mat-dialog-content>
        <p>Veuillez scanner le code QR ci-dessous avec l'application d'authentification de votre choix.</p>
        <img [src]="data" alt="QR Code">
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <button type="button" matButton mat-dialog-close class="btn btn-outline-primary">Fermer</button>
    </mat-dialog-actions>
</div>

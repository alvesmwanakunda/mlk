<button
  type="button"
  class="mobile-menu-toggle"
  (click)="toggleMobileMenu()"
  [attr.aria-expanded]="isMobileMenuOpen"
  aria-label="Ouvrir le menu"
>
  <i class="fa-solid" [ngClass]="isMobileMenuOpen ? 'fa-xmark' : 'fa-bars'"></i>
</button>

<div class="sidebar-backdrop" [class.show]="isMobileMenuOpen" (click)="closeMobileMenu()"></div>

<aside class="sidebar" [class.mobile-open]="isMobileMenuOpen">
    <div class="sidebar-logo">
      <div class="logo-icon"><img src="assets/images/mlka_logo.png" style="width: 109%;"></div>
      <span>MLKA GROUPE</span>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">Principal</div>
      <div class="nav-item" [routerLink]="['/dashboard']" [routerLinkActive]="['active']" (click)="closeMobileMenu()"><span class="nav-icon"><i class="fa-solid fa-house"></i></span> Accueil</div>
      <div class="nav-item" [routerLink]="['/produits']" [routerLinkActive]="['active']" (click)="closeMobileMenu()"><span class="nav-icon"><i class="fa-solid fa-box-open"></i></span> Produits</div>
      <!-- <div class="nav-item"  [routerLink]="['/devis']" [routerLinkActive]="['active']"><span class="nav-icon"><i class="fa-regular fa-file-lines"></i></span> Devis</div> -->
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">Gestion</div>
      <div class="nav-item" [routerLink]="['/entreprises']" [routerLinkActive]="['active']" *ngIf="user?.user?.role=='admin'" (click)="closeMobileMenu()"><span class="nav-icon"><i class="fa-regular fa-building"></i></span> Entreprises</div>
      <div class="nav-item" [routerLink]="['/contact']" [routerLinkActive]="['active']" *ngIf="user?.user?.role=='admin'" (click)="closeMobileMenu()"><span class="nav-icon"><i class="fa-regular fa-address-book"></i></span> Contacts</div>
      <div class="nav-item" [routerLink]="['/modulaires']" [routerLinkActive]="['active']" (click)="closeMobileMenu()"><span class="nav-icon"><i class="fa-solid fa-cubes"></i></span> Stock</div>
      <!-- <div class="nav-item" [routerLink]="['/box']" [routerLinkActive]="['active']"><span class="nav-icon"><i class="fa-solid fa-box-archive"></i></span> Box</div> -->
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">RH</div>
      <div class="nav-item" [routerLink]="['/agenda']" [routerLinkActive]="['active']" (click)="closeMobileMenu()"><span class="nav-icon"><i class="fa-regular fa-calendar-days"></i></span> Agenda</div>
      <div class="nav-item" [routerLink]="['/users']" [routerLinkActive]="['active']" *ngIf="user?.user?.role=='admin'" (click)="closeMobileMenu()"><span class="nav-icon"><i class="fa-solid fa-users"></i></span> Employés</div>
      <div class="nav-item" [routerLink]="['/conges']" [routerLinkActive]="['active']" (click)="closeMobileMenu()"><span class="nav-icon"><i class="fa-solid fa-umbrella-beach"></i></span> Congés</div>
      <div class="nav-item" [routerLink]="['/timesheet']" [routerLinkActive]="['active']" *ngIf="user?.user?.role=='admin'" (click)="closeMobileMenu()"><span class="nav-icon"><i class="fa-regular fa-clock"></i></span> Feuille de temps</div>
      <div class="nav-item" [routerLink]="['/agent/timesheet']" [routerLinkActive]="['active']" *ngIf="user?.user?.role=='agent'" (click)="closeMobileMenu()"><span class="nav-icon"><i class="fa-regular fa-clock"></i></span> Feuille de temps</div>

    </div>

    <div class="sidebar-bottom">
      <div class="user-profile" [matMenuTriggerFor]="userMenu">
        <div class="avatar">{{user?.user?.nom.substring(0, 1)}}{{user?.user?.prenom.substring(0, 1)}}</div>
        <div class="user-info">
          <div class="user-name">{{user?.user?.nom}} {{user?.user?.prenom}}</div>
          <!-- <div class="user-role">Chef de Projet</div> -->
        </div>
        <i class="fa-solid fa-gear" style="color: #fff;"></i>
      </div>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item [routerLink]="['/profil']">
          <mat-icon>person</mat-icon>
          <span>Mon profil</span>
        </button>
        <button mat-menu-item [routerLink]="['/parametres']">
          <mat-icon>settings</mat-icon>
          <span>Paramètre</span>
        </button>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Déconnexion</span>
        </button>
      </mat-menu>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <ng-content></ng-content>
  </div>

<div class="image-annotation-modal">
  <div class="annotation-header">
    <h3>Annoter l'image</h3>
    <div class="header-actions">
      <button class="btn btn-secondary" (click)="undo()" [disabled]="historyIndex <= 0">
        <i class="fa-solid fa-rotate-left"></i>
      </button>
      <button class="btn btn-secondary" (click)="redo()" [disabled]="historyIndex >= history.length - 1">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
      <button class="btn btn-secondary"
        [class.active]="selectedTool === 'select'"
        (click)="selectTool('select')"
        title="Sélectionner">
          <i class="fa-solid fa-arrows-up-down-left-right"></i>  Sélectionner
      </button>
      <button class="btn btn-secondary" (click)="deleteSelectedAnnotation()">
       <i class="fa-solid fa-trash"></i>  Supprimer la sélection
      </button>
      <button class="btn btn-secondary" (click)="clearAllAnnotations()">
        <i class="fa-solid fa-trash"></i> Tout effacer
      </button>
      <button class="btn btn-cancel" (click)="cancelAnnotation()">Annuler</button>
      <button class="btn btn-primary" (click)="saveAnnotation()">Enregistrer</button>
    </div>
  </div>

  <div class="annotation-container">
    <!-- Barre d'outils latérale -->
    <div class="toolbar">
      <div class="tool-group">
        <h4>Outils</h4>
        <div class="tool-buttons">
          <button
            class="tool-btn"
            [class.active]="selectedTool === 'pen'"
            (click)="selectTool('pen')"
            title="Crayon">
            <i class="fa-solid fa-pen"></i>
            <span>Crayon</span>
          </button>
          <button
            class="tool-btn"
            [class.active]="selectedTool === 'text'"
            (click)="selectTool('text')"
            title="Texte">
            <i class="fa-solid fa-font"></i>
            <span>Texte</span>
          </button>
          <button
            class="tool-btn"
            [class.active]="selectedTool === 'arrow'"
            (click)="selectTool('arrow')"
            title="Flèche">
            <i class="fa-solid fa-arrow-right"></i>
            <span>Flèche</span>
          </button>
          <button
            class="tool-btn"
            [class.active]="selectedTool === 'rectangle'"
            (click)="selectTool('rectangle')"
            title="Rectangle">
            <i class="fa-solid fa-square"></i>
            <span>Rectangle</span>
          </button>
          <button
            class="tool-btn"
            [class.active]="selectedTool === 'circle'"
            (click)="selectTool('circle')"
            title="Cercle">
            <i class="fa-solid fa-circle"></i>
            <span>Cercle</span>
          </button>
          <button
            class="tool-btn"
            [class.active]="selectedTool === 'erase'"
            (click)="selectTool('erase')"
            title="Effacer">
            <i class="fa-solid fa-eraser"></i>
            <span>Gomme</span>
          </button>
        </div>
      </div>

      <div class="tool-group">
        <h4>Couleurs</h4>
        <div class="color-palette">
          <button
            *ngFor="let color of ['#ff0000', '#0000ff', '#00ff00', '#ffff00', '#ff00ff', '#000000', '#ffffff']"
            class="color-btn"
            [style.background]="color"
            [class.active]="strokeColor === color"
            (click)="changeColor(color)"
            [style.border]="color === '#ffffff' ? '1px solid #ccc' : 'none'">
          </button>
        </div>
        <div class="current-color">
          Couleur: <span [style.color]="strokeColor">{{ strokeColor }}</span>
        </div>
      </div>

      <div class="tool-group" *ngIf="selectedTool === 'pen'">
        <h4>Épaisseur</h4>
        <input
          type="range"
          min="1"
          max="20"
          [value]="strokeWidth"
          (input)="onStrokeWidthChange($event)">
        <span class="slider-value">{{ strokeWidth }}px</span>
      </div>

      <div class="tool-group" *ngIf="selectedTool === 'text'">
        <h4>Taille du texte</h4>
        <input
          type="range"
          min="12"
          max="72"
          [value]="fontSize"
          (input)="onFontSizeChange($event)">
        <span class="slider-value">{{ fontSize }}px</span>
      </div>
    </div>

    <!-- Zone de dessin -->
    <div class="canvas-container">
      <div class="canvas-wrapper">
        <canvas
          #canvas
          [style.cursor]="cursorStyle"
          (mousedown)="onMouseDown($event)"
          (mousemove)="onMouseMove($event)"
          (mouseup)="onMouseUp()"
          (mouseleave)="onMouseUp()"
          (dblclick)="onCanvasDoubleClick($event)">
          Votre navigateur ne supporte pas Canvas.
        </canvas>

        <!-- Instructions -->
        <div class="canvas-hint" *ngIf="!isTextMode">
          <p>Utilisez les outils pour annoter l'image</p>
        </div>

        <!-- Saisie de texte -->
        <div
          *ngIf="isTextMode"
          class="text-input-overlay"
          [style.left.px]="textOverlayPosition.x"
          [style.top.px]="textOverlayPosition.y">
          <input
            #textInputField
            type="text"
            [(ngModel)]="textInput"
            placeholder="Saisir du texte..."
            (keyup.enter)="addText()"
            (keyup.escape)="cancelText()"
            [style.font-size.px]="fontSize"
            class="text-input">
          <div class="text-actions">
            <button class="text-btn confirm" (click)="addText()" title="Valider">
              <i class="fa-solid fa-check"></i>
            </button>
            <button class="text-btn cancel" (click)="cancelText()" title="Annuler">
              <i class="fa-solid fa-times"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

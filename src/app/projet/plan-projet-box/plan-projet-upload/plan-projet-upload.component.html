<input
  type="file"
  class="file-input"
  (change)="onFileSelected($event)"
  #fileUpload
  multiple
  [disabled]="isUploading">
<button type="button" (click)="fileUpload.click()" class="btn btn-projet" [disabled]="isUploading">
  <i class="fa-solid fa-cloud-arrow-up"></i> Charger
</button>

<div id="snackbar" *ngIf="phase === 'browser'">
  <br/>
  <div class="progress">
    <div class="progress-bar" role="progressbar" [style.width]="progress + '%'">{{progress}}%</div>
  </div>
  <br/>
  <p style="font-size: 12px;" *ngIf="progress < 100">Envoi de {{fileName}} vers le serveur...</p>
  <p style="font-size: 12px;color: rgb(16, 93, 38);" *ngIf="progress === 100">Envoi serveur terminé</p>
</div>

<div class="plan-sharepoint-upload" *ngIf="phase === 'sharepoint'">
  <mat-progress-spinner mode="determinate" [value]="sharepointProgress" diameter="52"></mat-progress-spinner>
  <p class="plan-sharepoint-upload-title">Envoi du fichier sur SharePoint...</p>
  <p class="plan-sharepoint-upload-progress">{{sharepointProgress}}%</p>
  <p class="plan-sharepoint-upload-file">{{fileName}}</p>
</div>

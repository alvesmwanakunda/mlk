<app-navbar>
  <div class="topbar">
        <div class="topbar-left">
          <h1>Feuille de temps</h1>
        </div>
        <div class="topbar-right">
        </div>
  </div>
  <div class="content">

    <div>
        <div class="row" style="margin-bottom: 25px;">
          <div class="col">
            <input type="text"  (keyup)="applyFilter($event)" class="search-input" id="exampleFormControlInput1" placeholder="Rechercher">
          </div>
        </div>
        <table mat-table [dataSource]="dataSource">
          <!-- Position Column -->

           <!-- Symbol Column -->
           <ng-container matColumnDef="month">
            <th mat-header-cell *matHeaderCellDef>Mois</th>
            <td mat-cell *matCellDef="let element" style="font-size: 12px;cursor: pointer;"> {{element?.month}}</td>
          </ng-container>

           <!-- Weight Column -->
           <ng-container matColumnDef="year">
            <th mat-header-cell *matHeaderCellDef>Année</th>
            <td mat-cell *matCellDef="let element" style="font-size: 12px;cursor: pointer;">{{element?.year}}  </td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef>Voir</th>
            <td mat-cell *matCellDef="let element" style="font-size: 12px;cursor: pointer;">
              <button mat-mini-fab color="primary" matTooltip="Détail" (click)="getTimesheet(element?.monthInt, element?.year)">
                <mat-icon>visibility</mat-icon>
              </button>
            </td>
          </ng-container>


          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator [pageSizeOptions]="[10, 20]"
                      showFirstLastButtons
                      aria-label="Select page of periodic elements"
                      >
        </mat-paginator>


    </div>

  </div>
</app-navbar>

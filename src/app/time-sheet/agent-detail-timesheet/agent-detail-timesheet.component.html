<app-navbar>
    <div class="topbar">
        <div class="topbar-left">
          <h1>Feuille de temps : {{month}}/{{year}}</h1>
        </div>
        <div class="topbar-right">
        </div>
  </div>
  <div class="content">
     <div>
       <div>
        <table class="table table-striped">
            <thead>
              <tr>
                <th scope="col" class="th-devis">Date</th>
                <th scope="col" class="th-devis">Tâche</th>
                <th scope="col" class="th-devis">Heure</th>
              </tr>
            </thead>
            <tbody>
                <tr *ngFor="let m of timesheet">
                  <td class="td-chat"><p class="info-tab">{{m?.createdAt | date : 'dd/MM/yyyy'}}</p></td>
                  <td class="td-chat"><p class="info-tab">{{m?.tache}}</p></td>
                  <td class="td-chat"><p class="info-tab">{{m?.heure}}</p></td>
                </tr>
              </tbody>
        </table>

       </div>
    </div>
  </div>
</app-navbar>

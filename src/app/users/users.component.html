<app-navbar>
    <div class="topbar">
        <div class="topbar-left">
          <h1>Employées</h1>
        </div>
        <div class="topbar-right">
          <button class="topbar-btn btn-primary" [routerLink]="['/users/nouveau']"> + Nouveau</button>
        </div>
  </div>
  <div class="content">
     <div>
        <div class="row" style="margin-bottom: 35px;">
          <div class="col">
            <input type="text"  (keyup)="applyFilter($event)" class="search-input" id="exampleFormControlInput1" placeholder="Rechercher">
          </div>
          <div class="col"  align="right">
          </div>
        </div>

        <table mat-table [dataSource]="dataSource">
          <!-- Position Column -->

           <!-- Symbol Column -->
           <ng-container matColumnDef="nom">
            <th mat-header-cell *matHeaderCellDef class="tableau-title">Nom</th>
            <td mat-cell *matCellDef="let element" style="font-size: 12px;cursor: pointer;"> {{element?.nom}} {{element?.prenom}}</td>
          </ng-container>

           <!-- Weight Column -->
           <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef class="tableau-title">Email</th>
            <td mat-cell *matCellDef="let element" style="font-size: 12px;cursor: pointer;">{{element?.email}}  </td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef class="tableau-title">Status</th>
            <td mat-cell *matCellDef="let element" style="font-size: 12px;cursor: pointer;">
              <button mat-mini-fab color="warn" matTooltip="Désactiver l'utilisateur" (click)="dissableEmploye(element?.id)" *ngIf="element?.valid">
                <mat-icon>delete</mat-icon>
              </button>
              <button mat-mini-fab color="primary" matTooltip="Activer l'utilisateur" (click)="activeEmploye(element?.id)" *ngIf="!element?.valid">
                <mat-icon>check</mat-icon>
              </button>
            </td>
          </ng-container>

          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef class="tableau-title">Action</th>
            <td mat-cell *matCellDef="let element">
              <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #menu="matMenu">
                <button mat-menu-item (click)="getEmploye(element?.id)">
                  <mat-icon>visibility</mat-icon>
                  <span>Détail</span>
                </button>
              </mat-menu>
            </td>
          </ng-container>


          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator [pageSizeOptions]="[10, 20]"
                      showFirstLastButtons
                      aria-label="Select page of periodic elements"
                      >
        </mat-paginator>


    </div>
  </div>
</app-navbar>
